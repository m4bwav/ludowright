# Runs the tests on the three operating systems the CLI promises, on the oldest and newest Python it supports,
# and fails at a red size budget so the always-loaded footprint stays small.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
        # Ubuntu 26.04 runners have no 3.9 build; macOS and Windows still cover the oldest version.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: test suite
        run: python -m unittest discover -s tests
      - name: the CLI answers from a clean checkout
        run: python skills/ludowright/scripts/ldw.py --version
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: size budget (red fails)
        run: python scripts/budget.py
